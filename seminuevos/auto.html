<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha del auto · Ruta Segura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/extras.css">
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="site-logo" href="index.html">Ruta<span>Segura</span></a>
    <nav class="site-nav" aria-label="Principal">
      <button class="menu-button" type="button" popovertarget="site-menu" aria-controls="site-menu">Menú</button>
      <ul id="site-menu" class="site-menu" popover="auto">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="index.html#catalogo" aria-current="page">Catálogo</a></li>
        <li><a href="index.html#garantia">Garantía</a></li>
        <li><a class="btn" href="#visita">Agendar visita</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="wrap" id="contenido">
  <p class="crumb"><a href="index.html#catalogo">← Volver al catálogo</a></p>
  <div id="ficha"></div>
  <section class="parecidos" id="parecidos" hidden>
    <h2>También te pueden gustar</h2>
    <ul class="grid" id="lista-parecidos" style="margin-block-start:1.5rem"></ul>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p><strong>Ruta Segura</strong> · Av. Ejemplo 500, Ciudad · Tel. 55 0000 0000</p>
    <p><a href="../index.html">Ver todas las demos</a> · © <span data-year></span> Sitio de demostración.</p>
  </div>
</footer>
<a class="wa" href="https://wa.me/520000000000" aria-label="Escribir por WhatsApp"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C8.8 3 3 8.8 3 16c0 2.3.6 4.5 1.7 6.4L3 29l6.8-1.7c1.8 1 3.9 1.5 6.2 1.5 7.2 0 13-5.800 13-13S23.200 3 16 3zm0 23.600c-2 0-3.900-.5-5.500-1.500l-.4-.2-4 1 1.100-3.900-.3-.4C5.800 19.900 5.200 18 5.200 16 5.200 9.900 10.100 5.200 16 5.200S26.800 10 26.800 16 21.900 26.600 16 26.600zm5.900-7.900c-.3-.2-1.900-.9-2.200-1s-.5-.2-.7.200-.8 1-1 1.200-.4.200-.7.100c-1.900-.9-3.100-1.700-4.300-3.800-.3-.6.300-.5.900-1.700.1-.2 0-.4 0-.5l-1-2.300c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.5.100-.8.400s-1.100 1.100-1.100 2.600 1.100 3 1.300 3.200c.2.200 2.200 3.400 5.400 4.700 2 .8 2.800.9 3.800.7.6-.1 1.900-.8 2.200-1.600.3-.8.300-1.400.2-1.600-.1-.1-.3-.2-.6-.4z"/></svg></a>

<script type="module">
import "../assets/extras.js";
import { autos, fmtPrecio, fmtKm, imagen } from "./autos.js";
import { favoritos, alternarFavorito } from "./favoritos.js";

const id = new URLSearchParams(location.search).get("id");
const a = autos.find(x => x.id === id);
const cont = document.getElementById("ficha");
const corazon = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-4.4-9.3-9C1.2 8.800 3 5.500 6.200 5.500c1.900 0 3.100 1 3.800 2.100.7-1.100 1.900-2.100 3.800-2.100 3.200 0 5 3.300 3.500 6.500C19 16.600 12 21 12 21z"/></svg>`;

if (!a) {
  document.title = "Auto no encontrado · Ruta Segura";
  cont.innerHTML = `<div class="empty"><h1>No encontramos ese auto</h1><p>Puede que ya se haya vendido.</p><a class="btn" href="index.html#catalogo">Ver el catálogo</a></div>`;
} else {
  const nombre = `${a.marca} ${a.modelo} ${a.version} ${a.anio}`;
  document.title = `${nombre} · Ruta Segura`;
  const filas = [["Año", a.anio], ["Kilometraje", fmtKm(a.km)], ["Transmisión", a.transmision], ["Combustible", a.combustible], ["Motor", a.motor],
    ["Potencia", a.potencia], ["Color", a.color], ["Puertas", a.puertas], ["Asientos", a.asientos], ["Dueños anteriores", a.duenos], ["Ubicación", a.ciudad]];
  cont.innerHTML = `
  <article class="ficha">
    <div>
      <div class="photo" style="position:relative">${imagen(a, { lazy: false })}<button class="fav" type="button" id="fav" aria-pressed="${favoritos().includes(a.id)}" aria-label="Guardar ${a.marca} ${a.modelo} en favoritos">${corazon}</button></div>
      <h1 style="margin-block:1.5rem .5rem;font-size:clamp(1.8rem,1rem+3vw,2.8rem)">${nombre}</h1>
      <p>${a.tipo} · ${fmtKm(a.km)} · ${a.transmision}</p>
      <h2 style="margin-block:2rem .75rem">Ficha técnica</h2>
      <dl class="specs">${filas.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
      <h2 style="margin-block:2rem .5rem">Equipamiento</h2>
      <ul class="equip">${a.equipo.map(e => `<li>${e}</li>`).join("")}</ul>
    </div>
    <aside class="panel" id="visita" aria-label="Contacto y financiamiento">
      <p style="margin:0;color:#35586b">Precio de contado</p>
      <p class="price">${fmtPrecio(a.precio)}</p>
      <p style="margin:0">Incluye 1 año de garantía y revisión de 120 puntos.</p>

      <div class="calc-box" id="calc">
        <h3 style="font-size:1.1rem">Calcula tu mensualidad</h3>
        <div><label for="enganche">Enganche: <output id="o-eng"></output></label><input id="enganche" type="range" min="10" max="60" step="5" value="30"></div>
        <div><label for="meses">Plazo: <output id="o-meses"></output></label><input id="meses" type="range" min="12" max="60" step="12" value="48"></div>
        <p style="margin:0;color:#35586b">Mensualidad aproximada</p>
        <p class="mensual" id="mensual" aria-live="polite"></p>
        <p style="margin:0;font-size:.9rem;color:#35586b">Tasa de ejemplo del 13% anual. No es una oferta de crédito.</p>
      </div>

      <form data-demo="Gracias. Esta es una demo: no se envió ninguna solicitud.">
        <div><label for="n">Nombre</label><input id="n" name="nombre" autocomplete="name" required></div>
        <div><label for="t">WhatsApp</label><input id="t" name="tel" type="tel" autocomplete="tel" inputmode="tel" required></div>
        <button class="btn" type="submit">Agendar prueba de manejo</button>
        <p role="status" aria-live="polite"></p>
      </form>
    </aside>
  </article>`;

  // Favorito
  const fav = document.getElementById("fav");
  fav.addEventListener("click", () => fav.setAttribute("aria-pressed", String(alternarFavorito(a.id))));

  // Calculadora (crédito a tasa fija)
  const enganche = document.getElementById("enganche"), meses = document.getElementById("meses");
  const calcular = () => {
    const eng = +enganche.value, n = +meses.value, i = 0.13 / 12;
    const monto = a.precio * (1 - eng / 100);
    document.getElementById("o-eng").textContent = `${eng}% (${fmtPrecio(a.precio * eng / 100)})`;
    document.getElementById("o-meses").textContent = `${n} meses`;
    document.getElementById("mensual").textContent = fmtPrecio(monto * i / (1 - Math.pow(1 + i, -n))) + " al mes";
  };
  enganche.addEventListener("input", calcular); meses.addEventListener("input", calcular); calcular();

  // Autos parecidos: mismo tipo o misma marca
  const parecidos = autos.filter(x => x.id !== a.id && (x.tipo === a.tipo || x.marca === a.marca)).slice(0, 3);
  const otros = parecidos.length ? parecidos : autos.filter(x => x.id !== a.id).slice(0, 3);
  document.getElementById("lista-parecidos").innerHTML = otros.map(x => `
    <li class="car"><a class="photo" href="auto.html?id=${x.id}" tabindex="-1" aria-hidden="true">${imagen(x)}</a>
    <div class="body"><h3>${x.marca} ${x.modelo} ${x.version}</h3><p class="meta">${x.anio} · ${fmtKm(x.km)} · ${x.transmision}</p>
    <p class="price">${fmtPrecio(x.precio)}</p><a class="btn" href="auto.html?id=${x.id}">Ver ficha de ${x.marca} ${x.modelo}</a></div></li>`).join("");
  document.getElementById("parecidos").hidden = false;
}
// extras.js no ve los formularios creados aquí, así que los conectamos a mano.
for (const form of cont.querySelectorAll("form[data-demo]")) {
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    form.querySelector("[role=status]").textContent = form.dataset.demo;
    form.reset();
  });
}
</script>
</body>
</html>
